[package]
name = "triport-examples"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.100"
bs58 = "0.5.1"
futures = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14.6", features = ["tls-native-roots"] }
yellowstone-grpc-proto = "14.0.1"

[[bin]]
name = "solana-rpc-slot-balance"
path = "solana-rpc-slot-balance/main.rs"

[[bin]]
name = "solana-yellowstone-grpc-pump-fun-monitor"
path = "solana-yellowstone-grpc-pump-fun-monitor/main.rs"
